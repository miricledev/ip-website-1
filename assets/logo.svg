<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
  
  <!-- Inner Performance text -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#logoGradient)">
    INNER
  </text>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#logoGradient)">
    PERFORMANCE
  </text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="8" fill="none" stroke="url(#logoGradient)" stroke-width="1" opacity="0.6"/>
  <circle cx="30" cy="30" r="3" fill="url(#logoGradient)" opacity="0.8"/>
</svg>
